<svg xmlns="http://www.w3.org/2000/svg" width="400" height="3528" viewBox="0 72 400 3528" role="img" aria-labelledby="title description">
  <title id="title">Add to Home Screen from Brave</title>
  <desc id="description">Seven numbered steps: Share, View More and Open in Safari in Brave, followed by the four Safari installation steps.</desc>
