<svg xmlns="http://www.w3.org/2000/svg" width="400" height="2060" viewBox="0 0 400 2060" role="img" aria-labelledby="title description">
  <title id="title" data-i18n="guide:svgTitle">Add to Home Screen in iPhone Safari: four steps</title>
  <desc id="description" data-i18n="guide:svgDesc">Four numbered steps for iPhone Safari: open the Page Menu, tap Share, tap View More, then tap Add to Home Screen. Blue outlines identify the controls to tap. Full text instructions are supplied separately.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #202124; }
    .heading { font-size: 28px; font-weight: 650; }
    .subtitle { font-size: 16px; fill: #60656c; }
    .step-title { font-size: 23px; font-weight: 650; }
    .instruction { font-size: 17px; fill: #60656c; }
    .label { font-size: 16px; }
    .small { font-size: 14px; }
    .icon { fill: none; stroke: #202124; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
    .line { fill: none; stroke: #d7dadd; stroke-width: 2; stroke-linecap: round; }
    .target { fill: #eef5ff; stroke: #2463eb; stroke-width: 3; }
  </style>
  <defs>
    <g id="phone">
      <rect x="72" y="90" width="272" height="396" rx="32" fill="#fff" stroke="#959ba2" stroke-width="2"/>
      <path d="M183 108h50" class="line"/>
      <rect x="86" y="126" width="244" height="308" rx="9" fill="#f5f6f7"/>
      <path d="M104 151h88 M104 172h200 M104 185h168" class="line"/>
      <rect x="104" y="213" width="200" height="78" rx="8" fill="#e9ecef"/>
      <path d="M104 313h200 M104 327h170 M104 341h184" class="line"/>
      <path d="M179 472h58" stroke="#959ba2" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g id="share-icon" class="icon">
      <path d="M10 17V2 M5 7l5-5 5 5 M5 12H2v17h16V12h-3"/>
    </g>
  </defs>
  <rect width="400" height="2060" fill="white"/>
  <text x="28" y="48" class="heading" data-i18n="guide:heading" data-max-width="372">Add to Home Screen</text>
  <text x="28" y="76" class="subtitle" data-i18n="guide:subtitle" data-max-width="372">iPhone · Safari</text>
  <g id="step-1" transform="translate(28 100)" role="group" aria-labelledby="step-1-title">
    <circle cx="18" cy="18" r="18" fill="#2463eb"/>
    <text x="18" y="24" text-anchor="middle" style="font-size:19px;font-weight:650;fill:white">1</text>
    <text id="step-1-title" x="48" y="25" class="step-title" data-i18n="step">Open the <tspan font-style="italic">Page Menu</tspan></text>
    <g transform="translate(-72 -30)">
      <use href="#phone"/>
      <rect x="90" y="420" width="236" height="38" rx="19" fill="white" stroke="#d7dadd"/>
      <rect x="98" y="421" width="40" height="36" rx="10" class="target"/>
      <path d="M109 431h18 M109 438h18 M109 445h11" class="icon"/>
      <text x="149" y="444" class="small" style="fill:#687078" data-pwa-domain="true" data-domain-width="125">example.com</text>
      <g transform="translate(289 426) scale(.75)" class="icon">
        <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8 M21 3v5h-5"/>
      </g>
    </g>
  </g>
  <g id="step-2" transform="translate(28 590)" role="group" aria-labelledby="step-2-title">
    <circle cx="18" cy="18" r="18" fill="#2463eb"/>
    <text x="18" y="24" text-anchor="middle" style="font-size:19px;font-weight:650;fill:white">2</text>
    <text id="step-2-title" x="48" y="25" class="step-title" data-i18n="step">Tap <tspan font-style="italic">Share</tspan></text>
    <g transform="translate(-72 -30)">
      <use href="#phone"/>
      <rect x="105" y="199" width="206" height="249" rx="20" fill="white" stroke="#d7dadd"/>
      <text x="125" y="233" class="label" style="fill:#687078" data-i18n="label:show-reader" data-max-width="193" data-lines="2" data-line-height="17" data-center-lines="1">Show Reader</text>
      <path d="M121 250h174" class="line"/>
      <text x="125" y="280" class="label" style="fill:#687078" data-i18n="label:summarise" data-max-width="193">Summarise</text>
      <rect x="115" y="299" width="186" height="50" rx="10" class="target"/>
      <use href="#share-icon" x="130" y="308"/>
      <text x="164" y="330" class="label" data-i18n="label:share" data-max-width="154">Share</text>
      <text x="125" y="381" class="small" style="fill:#687078" data-i18n="label:add-to-reading-list" data-max-width="193" data-lines="2" data-line-height="13" data-center-lines="1">Add to Reading List</text>
      <path d="M125 410h152 M125 427h124" class="line"/>
    </g>
  </g>
  <g id="step-3" transform="translate(28 1080)" role="group" aria-labelledby="step-3-title">
    <circle cx="18" cy="18" r="18" fill="#2463eb"/>
    <text x="18" y="24" text-anchor="middle" style="font-size:19px;font-weight:650;fill:white">3</text>
    <text id="step-3-title" x="48" y="25" class="step-title" data-i18n="step">Tap <tspan font-style="italic">View More</tspan></text>
    <g transform="translate(-72 -30)">
      <use href="#phone"/>
      <rect x="83" y="250" width="250" height="213" rx="24" fill="white" stroke="#d7dadd"/>
      <rect x="100" y="269" width="30" height="30" rx="7" fill="#e9ecef"/>
      <text x="142" y="283" class="label" style="fill:#687078" data-i18n="label:website" data-max-width="176">Website</text>
      <text x="142" y="303" class="small" fill="#60656c" style="fill:#687078" data-pwa-domain="true" data-domain-width="170">example.com</text>
      <path d="M100 320h216" class="line"/>
      <rect x="103" y="336" width="38" height="38" rx="11" fill="#e9ecef"/>
      <rect x="159" y="336" width="38" height="38" rx="11" fill="#e9ecef"/>
      <rect x="215" y="336" width="38" height="38" rx="11" fill="#e9ecef"/>
      <path d="M100 390h216" class="line"/>
      <circle cx="123" cy="416" r="17" fill="#e9ecef"/>
      <circle cx="178" cy="416" r="17" fill="#e9ecef"/>
      <rect x="219" y="397" width="101" height="58" rx="10" class="target"/>
      <path d="m260 411 10 10 10-10" class="icon"/>
      <text x="270" y="444" text-anchor="middle" class="small" data-i18n="label:view-more" data-max-width="100" data-lines="2" data-line-height="12" data-center-lines="1">View More</text>
    </g>
  </g>
  <g id="step-4" transform="translate(28 1570)" role="group" aria-labelledby="step-4-title">
    <circle cx="18" cy="18" r="18" fill="#2463eb"/>
    <text x="18" y="24" text-anchor="middle" style="font-size:19px;font-weight:650;fill:white">4</text>
    <text id="step-4-title" x="48" y="25" class="step-title" data-i18n="step">Tap <tspan font-style="italic">Add to Home Screen</tspan></text>
    <g transform="translate(-72 -30)">
      <use href="#phone"/>
      <rect x="83" y="126" width="250" height="337" rx="15" fill="white"/>
      <text x="103" y="159" class="label" style="fill:#687078" data-i18n="label:website" data-max-width="215">Website</text>
      <text x="103" y="182" class="small" style="fill:#687078" data-pwa-domain="true" data-domain-width="170">example.com</text>
      <path d="M100 204h216" class="line"/>
      <rect x="105" y="220" width="35" height="35" rx="10" fill="#e9ecef"/>
      <rect x="163" y="220" width="35" height="35" rx="10" fill="#e9ecef"/>
      <path d="m274 240 9-9 9 9" class="icon"/>
      <text x="283" y="270" text-anchor="middle" class="small" style="fill:#687078" data-i18n="label:view-less" data-bounds="210 316" data-max-width="106" data-lines="2" data-line-height="12" data-center-lines="1">View Less</text>
      <rect x="94" y="287" width="228" height="157" rx="15" fill="#f1f2f3"/>
      <text x="108" y="316" class="small" style="fill:#687078" data-i18n="label:add-bookmark-to" data-max-width="210" data-lines="2" data-line-height="13" data-center-lines="1">Add Bookmark to…</text>
      <path d="M108 333h200" class="line"/>
      <text x="108" y="361" class="small" style="fill:#687078" data-i18n="label:find-on-page" data-max-width="210">Find on Page</text>
      <rect x="91" y="384" width="234" height="52" rx="10" class="target"/>
      <rect x="102" y="400" width="18" height="21" rx="4" class="icon"/>
      <path d="M106 410h10 M111 405v10" class="icon"/>
      <text x="130" y="415" class="label" data-i18n="label:add-to-home-screen" data-max-width="188" data-lines="2" data-line-height="17" data-center-lines="1">Add to Home Screen</text>
    </g>
  </g>
</svg>
