<svg xmlns="http://www.w3.org/2000/svg" width="400" height="1570" viewBox="0 0 400 1570" role="img" aria-labelledby="title description">
  <title id="title">Add to Home Screen from Chrome</title>
  <desc id="description">Three steps in iPhone Chrome: Share at the top right of the address bar, View More, then Add to Home Screen.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #202124; }
    .heading { font-size: 28px; font-weight: 650; }
    .subtitle { font-size: 16px; fill: #60656c; }
    .step-title { font-size: 23px; font-weight: 650; }
    .instruction { font-size: 17px; fill: #60656c; }
    .label { font-size: 16px; }
    .small { font-size: 14px; }
    .icon { fill: none; stroke: #202124; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
    .line { fill: none; stroke: #d7dadd; stroke-width: 2; stroke-linecap: round; }
    .target { fill: #eef5ff; stroke: #2463eb; stroke-width: 3; }
  </style>
  <defs>
    <g id="phone">
      <rect x="72" y="90" width="272" height="396" rx="32" fill="#fff" stroke="#959ba2" stroke-width="2"/>
      <path d="M183 108h50" class="line"/>
      <rect x="86" y="126" width="244" height="308" rx="9" fill="#f5f6f7"/>
      <path d="M104 151h88 M104 172h200 M104 185h168" class="line"/>
      <rect x="104" y="213" width="200" height="78" rx="8" fill="#e9ecef"/>
      <path d="M104 313h200 M104 327h170 M104 341h184" class="line"/>
      <path d="M179 472h58" stroke="#959ba2" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g id="share-icon" class="icon">
      <path d="M10 17V2 M5 7l5-5 5 5 M5 12H2v17h16V12h-3"/>
    </g>
  <g id="shared-ios-safari-iphone-layout-1-phone">
      <rect x="72" y="90" width="272" height="396" rx="32" fill="#fff" stroke="#959ba2" stroke-width="2"/>
      <path d="M183 108h50" class="shared-ios-safari-iphone-layout-1-line"/>
      <rect x="86" y="126" width="244" height="308" rx="9" fill="#f5f6f7"/>
      <path d="M104 151h88 M104 172h200 M104 185h168" class="shared-ios-safari-iphone-layout-1-line"/>
      <rect x="104" y="213" width="200" height="78" rx="8" fill="#e9ecef"/>
      <path d="M104 313h200 M104 327h170 M104 341h184" class="shared-ios-safari-iphone-layout-1-line"/>
      <path d="M179 472h58" stroke="#959ba2" stroke-width="3" stroke-linecap="round"/>
    </g><g id="shared-ios-safari-iphone-layout-1-share-icon" class="shared-ios-safari-iphone-layout-1-icon">
      <path d="M10 17V2 M5 7l5-5 5 5 M5 12H2v17h16V12h-3"/>
    </g></defs>
  <rect width="400" height="1570" fill="white"/>
  <text x="28" y="48" class="heading">Add to Home Screen</text>
  <text x="28" y="76" class="subtitle">iPhone · Chrome</text>
  <g id="step-1" transform="translate(28 100)" role="group" aria-labelledby="step-1-title">
    <circle cx="18" cy="18" r="18" fill="#2463eb"/>
    <text x="18" y="24" text-anchor="middle" style="font-size:19px;font-weight:650;fill:white">1</text>
    <text id="step-1-title" x="48" y="25" class="step-title">Tap Share</text>
    <g transform="translate(-72 -30)">
      <use href="#phone"/>
      <rect x="86" y="126" width="244" height="43" rx="18" fill="white" stroke="#d7dadd"/>
      <text x="177" y="153" text-anchor="middle" class="small" style="fill:#687078" data-pwa-domain="true" data-domain-width="180">example.com</text>
      <rect x="282" y="128" width="42" height="39" rx="10" class="target"/>
      <use href="#share-icon" x="293" y="132"/>
      <rect x="84" y="415" width="248" height="45" rx="10" fill="white"/>
      <path d="m108 427-8 10 8 10 m40-20 8 10-8 10 M207 429v16 M199 437h16" class="line"/>
      <rect x="263" y="427" width="18" height="20" rx="3" fill="none" stroke="#a3a8ae"/>
    </g>
  </g>
  
  <g id="step-3" transform="translate(28 1080)" role="group" aria-labelledby="step-3-title">
    <circle cx="18" cy="18" r="18" fill="#2463eb"/>
    <text x="18" y="24" text-anchor="middle" style="font-size:19px;font-weight:650;fill:white">3</text>
    <text id="step-3-title" x="48" y="25" class="step-title">Tap Add to Home Screen</text>
    <g transform="translate(-72 -30)">
      <use href="#phone"/>
      <rect x="83" y="126" width="250" height="337" rx="15" fill="white"/>
      <text x="103" y="159" class="label" style="fill:#687078">Website</text>
      <text x="103" y="182" class="small" style="fill:#687078" data-pwa-domain="true" data-domain-width="170">example.com</text>
      <rect x="94" y="211" width="228" height="139" rx="15" fill="#f1f2f3"/>
      <text x="108" y="236" class="small" style="fill:#687078">Add to bookmarks</text>
      <text x="108" y="262" class="small" style="fill:#687078">Create a QR code</text>
      <text x="108" y="288" class="small" style="fill:#687078">Find in Page</text>
      <text x="108" y="314" class="small" style="fill:#687078">Request desktop site</text>
      <text x="108" y="340" class="small" style="fill:#687078">Print</text>
      <rect x="94" y="365" width="228" height="89" rx="15" fill="#f1f2f3"/>
      <rect x="91" y="367" width="234" height="45" rx="10" class="target"/>
      <rect x="102" y="379" width="18" height="21" rx="4" class="icon"/>
      <path d="M106 389h10 M111 384v10" class="icon"/>
      <text x="130" y="395" class="label">Add to Home Screen</text>
      <text x="108" y="437" class="small" style="fill:#687078">Add to New Quick Note</text>
    </g>
  </g>
<style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #202124; }
    .shared-ios-safari-iphone-layout-1-heading { font-size: 28px; font-weight: 650; }
    .shared-ios-safari-iphone-layout-1-subtitle { font-size: 16px; fill: #60656c; }
    .shared-ios-safari-iphone-layout-1-step-title { font-size: 23px; font-weight: 650; }
    .shared-ios-safari-iphone-layout-1-instruction { font-size: 17px; fill: #60656c; }
    .shared-ios-safari-iphone-layout-1-label { font-size: 16px; }
    .shared-ios-safari-iphone-layout-1-small { font-size: 14px; }
    .shared-ios-safari-iphone-layout-1-icon { fill: none; stroke: #202124; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
    .shared-ios-safari-iphone-layout-1-line { fill: none; stroke: #d7dadd; stroke-width: 2; stroke-linecap: round; }
    .shared-ios-safari-iphone-layout-1-target { fill: #eef5ff; stroke: #2463eb; stroke-width: 3; }
  </style><g id="step-2" transform="translate(28 590)" role="group" aria-labelledby="step-2-title">
    <circle cx="18" cy="18" r="18" fill="#2463eb"/>
    <text x="18" y="24" text-anchor="middle" style="font-size:19px;font-weight:650;fill:white">2</text>
    <text id="step-2-title" x="48" y="25" class="shared-ios-safari-iphone-layout-1-step-title">Tap View More</text>
    <g transform="translate(-72 -30)">
      <use href="#shared-ios-safari-iphone-layout-1-phone"/>
      <rect x="83" y="250" width="250" height="213" rx="24" fill="white" stroke="#d7dadd"/>
      <rect x="100" y="269" width="30" height="30" rx="7" fill="#e9ecef"/>
      <text x="142" y="283" class="shared-ios-safari-iphone-layout-1-label" style="fill:#687078">Website</text>
      <text x="142" y="303" class="shared-ios-safari-iphone-layout-1-small" fill="#60656c" style="fill:#687078" data-pwa-domain="true" data-domain-width="170">example.com</text>
      <path d="M100 320h216" class="shared-ios-safari-iphone-layout-1-line"/>
      <rect x="103" y="336" width="38" height="38" rx="11" fill="#e9ecef"/>
      <rect x="159" y="336" width="38" height="38" rx="11" fill="#e9ecef"/>
      <rect x="215" y="336" width="38" height="38" rx="11" fill="#e9ecef"/>
      <path d="M100 390h216" class="shared-ios-safari-iphone-layout-1-line"/>
      <circle cx="123" cy="416" r="17" fill="#e9ecef"/>
      <circle cx="178" cy="416" r="17" fill="#e9ecef"/>
      <rect x="219" y="397" width="101" height="58" rx="10" class="shared-ios-safari-iphone-layout-1-target"/>
      <path d="m260 411 10 10 10-10" class="shared-ios-safari-iphone-layout-1-icon"/>
      <text x="270" y="444" text-anchor="middle" class="shared-ios-safari-iphone-layout-1-small">View More</text>
    </g>
  </g></svg>
