<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1860" viewBox="0 0 600 1860" role="img" aria-labelledby="title description">
  <title id="title" data-i18n="guide:svgTitle">Install an app in Windows Chrome</title>
  <desc id="description" data-i18n="guide:svgDesc">Documentation draft: schematic controls from current vendor instructions, not a verified device capture. Blue outlines identify the controls.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #202124; }
    .heading { font-size: 28px; font-weight: 650; }
    .subtitle { font-size: 16px; fill: #687078; }
    .step-title { font-size: 23px; font-weight: 650; }
    .label { font-size: 16px; }
    .small { font-size: 14px; }
    .muted { fill: #687078; }
    .line { fill: none; stroke: #d7dadd; stroke-width: 2; stroke-linecap: round; }
    .icon { fill: none; stroke: #687078; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .target { fill: #eef5ff; stroke: #2463eb; stroke-width: 3; }
  </style>
  <defs>
    <g id="browser">
      <rect x="0" y="58" width="544" height="330" rx="14" fill="white" stroke="#959ba2" stroke-width="2"/>
      <path d="M1 72q0-13 13-13h516q13 0 13 13v20H1Z" fill="#f1f2f3"/>
      <rect x="72" y="66" width="180" height="26" rx="7" fill="white"/>
      <text x="87" y="84" class="small muted" data-i18n="label:website" data-max-width="413">Website</text>
      <path d="M24 105l-7 7 7 7 M18 112h18" class="icon"/>
      <rect x="60" y="99" width="425" height="28" rx="14" fill="#f1f2f3"/>
      <text x="80" y="119" class="small muted" data-pwa-domain="true" data-domain-width="360">example.com</text>
      <circle cx="516" cy="106" r="2" fill="#687078"/>
      <circle cx="516" cy="113" r="2" fill="#687078"/>
      <circle cx="516" cy="120" r="2" fill="#687078"/>
      <path d="M28 166h170 M28 190h460 M28 210h400" class="line"/>
      <rect x="28" y="242" width="220" height="110" rx="9" fill="#f1f2f3"/>
      <rect x="267" y="242" width="249" height="110" rx="9" fill="#f1f2f3"/>
      <path d="M464 76h10 M488 71h10v10h-10Z M515 71l10 10m0-10-10 10" class="icon"/>
    </g>
    <g id="dialog-background">
      <use href="#browser"/>
      <rect x="1" y="130" width="542" height="244" fill="#202124" opacity="0.12"/>
    </g>
    <g id="app-icon">
      <rect width="40" height="40" rx="9" fill="#e2e5e9"/>
      <path d="M10 12h20 M10 20h20 M10 28h12" class="line"/>
    </g>
  </defs>
  <rect width="600" height="1860" fill="white"/>
  <text x="28" y="48" class="heading" data-i18n="guide:heading" data-max-width="572">Install app</text>
  <text x="28" y="76" class="subtitle" data-i18n="guide:subtitle" data-max-width="572">Windows · Chrome</text>
  <g id="step-1" transform="translate(28 100)" role="group" aria-labelledby="step-1-title">
    <circle cx="18" cy="18" r="18" fill="#2463eb"/>
    <text x="18" y="24" text-anchor="middle" style="font-size:19px;font-weight:650;fill:white">1</text>
    <text id="step-1-title" x="48" y="25" class="step-title" data-i18n="step">Open the <tspan font-style="italic">More</tspan> menu</text>
    <use href="#browser"/>
    <rect x="500" y="96" width="32" height="34" rx="8" class="target"/>
    <circle cx="516" cy="106" r="2"/>
    <circle cx="516" cy="113" r="2"/>
    <circle cx="516" cy="120" r="2"/>
  </g>
  <g id="step-2" transform="translate(28 540)" role="group" aria-labelledby="step-2-title">
    <circle cx="18" cy="18" r="18" fill="#2463eb"/>
    <text x="18" y="24" text-anchor="middle" style="font-size:19px;font-weight:650;fill:white">2</text>
    <text id="step-2-title" x="48" y="25" class="step-title" data-i18n="step">Choose <tspan font-style="italic">Cast, save and share</tspan></text>
    <use href="#browser"/>
    <rect x="254" y="134" width="274" height="238" rx="10" fill="white" stroke="#d7dadd"/>
    <text x="274" y="161" class="label muted" data-i18n="label:new-tab" data-max-width="226">New tab</text>
    <text x="274" y="193" class="label muted" data-i18n="label:history" data-max-width="226">History</text>
    <text x="274" y="225" class="label muted" data-i18n="label:downloads" data-max-width="226">Downloads</text>
    <text x="274" y="257" class="label muted" data-i18n="label:print" data-max-width="226">Print…</text>
    <text x="274" y="289" class="label muted" data-i18n="label:find-and-edit" data-max-width="226">Find and edit</text>
    <rect x="262" y="314" width="258" height="42" rx="8" class="target"/>
    <text x="274" y="341" class="label" data-i18n="label:cast-save-and-share" data-max-width="226" data-lines="2" data-line-height="17" data-center-lines="1">Cast, save and share</text>
    <path d="m500 329 5 6-5 6" class="icon"/>
  </g>
  <g id="step-3" transform="translate(28 980)" role="group" aria-labelledby="step-3-title">
    <circle cx="18" cy="18" r="18" fill="#2463eb"/>
    <text x="18" y="24" text-anchor="middle" style="font-size:19px;font-weight:650;fill:white">3</text>
    <text id="step-3-title" x="48" y="25" class="step-title" data-i18n="step">Choose <tspan font-style="italic">Install</tspan></text>
    <use href="#browser"/>
    <rect x="24" y="148" width="496" height="224" rx="10" fill="white" stroke="#d7dadd"/>
    <text x="44" y="176" class="small muted" data-i18n="label:cast-save-and-share" data-max-width="456">Cast, save and share</text>
    <text x="44" y="214" class="label muted" data-i18n="label:save-page-as" data-max-width="456">Save page as…</text>
    <rect x="36" y="236" width="472" height="44" rx="8" class="target"/>
    <rect x="48" y="249" width="18" height="18" rx="4" fill="#d7dadd"/>
    <text x="80" y="264" class="label" data-i18n="label:install-website" data-max-width="420">Install Website…</text>
    <text x="44" y="310" class="label muted" data-i18n="label:create-shortcut" data-max-width="456">Create shortcut…</text>
    <text x="44" y="349" class="label muted" data-i18n="label:copy-link" data-max-width="456">Copy link</text>
  </g>
  <g id="step-4" transform="translate(28 1420)" role="group" aria-labelledby="step-4-title">
    <circle cx="18" cy="18" r="18" fill="#2463eb"/>
    <text x="18" y="24" text-anchor="middle" style="font-size:19px;font-weight:650;fill:white">4</text>
    <text x="48" y="25" class="step-title" id="step-4-title" data-i18n="step">Click <tspan font-style="italic">Install</tspan></text>
    <use href="#dialog-background"/>
    <rect x="62" y="143" width="420" height="220" rx="15" fill="white" stroke="#d7dadd"/>
    <text x="84" y="176" class="label" data-i18n="label:install-app" data-max-width="416">Install app</text>
    <use href="#app-icon" transform="translate(84 206)"/>
    <text x="138" y="222" class="label muted" data-i18n="label:website" data-max-width="362">Website</text>
    <text x="138" y="246" class="small muted" data-pwa-domain="true" data-domain-width="310">example.com</text>
    <text x="282" y="336" class="small muted" data-i18n="label:cancel" data-before-pill="1" data-max-width="70">Cancel</text>
    <rect x="359" y="311" width="101" height="38" rx="19" class="target" data-pill="350 486"/>
    <text x="409" y="336" class="label" text-anchor="middle" data-i18n="label:install" data-max-width="130">Install</text>
  </g>
</svg>
